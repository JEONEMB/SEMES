const $=id=>document.getElementById(id);
let which='first', index=0, overview=true, timer=null;
const plots={};
function rows(){return data[which]}
function baseName(path){return path.split(/[\\/]/).pop()}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 재생'}
function select(n,scroll=false){overview=false;index=Math.max(0,Math.min(rows().length-1,n));update();if(scroll)$('rows').children[index].scrollIntoView({block:'nearest'})}
function switchData(key){stop();which=key;index=0;overview=true;$('first').classList.toggle('active',key==='first');$('second').classList.toggle('active',key==='second');$('slider').max=rows().length;$('source').textContent=key==='first'?'2026-10-04 · 파일 수정 시각(KST)':'2026-10-15 · ZIP 수정 시각(시간대 미기재)';$('warning').textContent=key==='first'?'파일명 라벨을 표시합니다. 파일명에 없는 반대 축은 명목상 0으로 두었으며, 실제 영점 복귀나 실제 로봇 좌표를 확인한 것은 아닙니다.':'기준 위치를 (0, 0)으로 둔 파일명 라벨입니다. center1·center2·center3는 같은 좌표이며 각각 전체 순번 #1·#2·#24입니다.';$('zoom-wrap').hidden=key==='first';$('plots').classList.toggle('single',key==='first');buildTable();buildLegend();update()}
function buildTable(){const body=$('rows');body.replaceChildren();rows().forEach((r,i)=>{const tr=document.createElement('tr');[r.order,r.time,r.y.toFixed(2),r.theta.toFixed(2),baseName(r.file)].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});tr.addEventListener('click',()=>{stop();select(i)});body.appendChild(tr)})}
function buildLegend(){const legends=which==='first'?[['#283747','① 기준'],['#d04b45','② Y 양수 .10 간격'],['#b78313','③ Y 음수 .10 간격'],['#36854c','④ θ 양수'],['#8653aa','⑤ θ 음수'],['#168aa6','⑥ Y +.05부터'],['#275ac2','⑦ Y −1.95부터']]:[['#283747','기준'],['#d04b45','Y .05'],['#8653aa','Y .10'],['#168aa6','Y .50'],['#275ac2','Y 1.00']];$('legend').replaceChildren();legends.forEach(([color,label])=>{const item=document.createElement('span'),dot=document.createElement('span');dot.className='dot';dot.style.background=color;item.appendChild(dot);item.appendChild(document.createTextNode(label));$('legend').appendChild(item)})}
function update(){const current=rows()[index];$('slider').value=index+1;$('all').classList.toggle('active',overview);$('rank').textContent=overview?`전체 ${rows().length}장`:`#${index+1} / ${rows().length}`;$('filename').textContent=overview?'전체 라벨 좌표와 기록 순서':baseName(current.file);$('time').textContent=overview?`${rows()[0].time} → ${rows().at(-1).time}`:current.time;$('coords').textContent=overview?'명목 라벨 좌표':`Y ${current.y.toFixed(2)} mm · θ ${current.theta.toFixed(2)}°`;const same=rows().filter(r=>r.y===current.y&&r.theta===current.theta);$('overlap').textContent=overview?'진한 점은 기록된 좌표입니다. 슬라이더를 움직이면 현재 사진과 그 이전 순서를 강조합니다.':`같은 라벨 좌표의 이미지: ${same.map(r=>'#'+r.order).join(', ')}`;Array.from($('rows').children).forEach((tr,i)=>tr.classList.toggle('selected',!overview&&i===index));draw('main',false);if(which==='second')draw('zoom',true)}
function draw(id,zoom){const canvas=$(id),width=canvas.clientWidth,height=canvas.clientHeight;if(!width)return;const dpr=window.devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const area={l:72,r:width-35,t:45,b:height-62};const lim=which==='first'?[-2.3,2.3,-1.18,1.18]:zoom?[-.05,1.13,-.018,.225]:[-.05,1.13,-.1,2.16];const X=x=>area.l+(x-lim[0])/(lim[1]-lim[0])*(area.r-area.l),Y=y=>area.b-(y-lim[2])/(lim[3]-lim[2])*(area.b-area.t);plots[id]={X,Y,lim};ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.font='bold 15px "Malgun Gothic",sans-serif';ctx.fillStyle='#182b43';ctx.fillText(zoom?'작은 θ 영역 확대':'전체 범위',area.l,23);ctx.font='11px "Malgun Gothic",sans-serif';const xt=which==='first'?[-2,-1,0,1,2]:[0,.05,.1,.5,1],yt=which==='first'?[-1,-.5,0,.5,1]:zoom?[0,.01,.02,.03,.1,.2]:[0,.5,1,1.5,2];ctx.strokeStyle='#e3eaf0';ctx.fillStyle='#52657b';xt.forEach(t=>{ctx.beginPath();ctx.moveTo(X(t),area.t);ctx.lineTo(X(t),area.b);ctx.stroke();ctx.save();ctx.translate(X(t),area.b+18);if(which==='second')ctx.rotate(-.65);ctx.textAlign='center';ctx.fillText(t.toString(),0,0);ctx.restore()});yt.forEach(t=>{ctx.beginPath();ctx.moveTo(area.l,Y(t));ctx.lineTo(area.r,Y(t));ctx.stroke();ctx.textAlign='right';ctx.fillText(t.toString(),area.l-10,Y(t)+4)});ctx.textAlign='center';ctx.font='13px "Malgun Gothic",sans-serif';ctx.fillText('Y 라벨 (mm)',(area.l+area.r)/2,height-5);ctx.save();ctx.translate(18,(area.t+area.b)/2);ctx.rotate(-Math.PI/2);ctx.fillText('θ 라벨 (°)',0,0);ctx.restore();ctx.save();ctx.beginPath();ctx.rect(area.l,area.t,area.r-area.l,area.b-area.t);ctx.clip();const end=overview?rows().length-1:index;
rows().forEach(r=>{ctx.beginPath();ctx.arc(X(r.y),Y(r.theta),3.4,0,Math.PI*2);ctx.fillStyle='#d9e1e9';ctx.fill()});
for(let i=1;i<=end;i++){const a=rows()[i-1],b=rows()[i];if(which==='first'&&a.group!==b.group)continue;if(a.y===b.y&&a.theta===b.theta)continue;const x1=X(a.y),y1=Y(a.theta),x2=X(b.y),y2=Y(b.theta);ctx.strokeStyle=which==='first'?b.color:'#8b9caf';ctx.globalAlpha=.65;ctx.lineWidth=1;ctx.setLineDash(which==='first'?[]:[4,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);const length=Math.hypot(x2-x1,y2-y1);if(length>14&&(which==='second'||i%4===0)){const angle=Math.atan2(y2-y1,x2-x1),px=x1+.65*(x2-x1),py=y1+.65*(y2-y1);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-7*Math.cos(angle-.45),py-7*Math.sin(angle-.45));ctx.moveTo(px,py);ctx.lineTo(px-7*Math.cos(angle+.45),py-7*Math.sin(angle+.45));ctx.stroke()}}ctx.globalAlpha=1;
rows().slice(0,end+1).forEach(r=>{ctx.beginPath();ctx.arc(X(r.y),Y(r.theta),which==='first'?3.3:4.4,0,Math.PI*2);ctx.fillStyle=r.color;ctx.fill()});
if(overview&&which==='second'){const groups=new Map();rows().forEach(r=>{const k=`${r.y},${r.theta}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});ctx.font='bold 10px "Malgun Gothic",sans-serif';for(const points of groups.values()){const r=points[0];if((!zoom&&r.theta>0&&r.theta<1)||(zoom&&r.theta>.2))continue;const label=r.y===0?'#1,2,24':`#${points[0].order}–${points.at(-1).order}`;let dx=r.y===.05?-10:9;ctx.textAlign=r.y===.05?'right':'left';ctx.fillStyle=r.color;ctx.fillText(label,X(r.y)+dx,Y(r.theta)-8)}}
if(!overview){const r=rows()[index];if(r.theta<=lim[3]&&r.theta>=lim[2]){ctx.beginPath();ctx.arc(X(r.y),Y(r.theta),10,0,Math.PI*2);ctx.strokeStyle='#172b43';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(X(r.y),Y(r.theta),5,0,Math.PI*2);ctx.fillStyle=r.color;ctx.fill();ctx.fillStyle='#172b43';ctx.font='bold 14px "Malgun Gothic",sans-serif';ctx.textAlign='left';ctx.fillText(`#${r.order}`,X(r.y)+14,Y(r.theta)-14)}}ctx.restore()}
['main','zoom'].forEach(id=>$(id).addEventListener('mousemove',event=>{const p=plots[id];if(!p)return;const rect=$(id).getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;let found=null,dist=15;rows().forEach(r=>{const d=Math.hypot(p.X(r.y)-x,p.Y(r.theta)-y);if(d<dist){dist=d;found=r}});$('hover').textContent=found?`Y=${found.y.toFixed(2)} mm, θ=${found.theta.toFixed(2)}° · 순번 ${rows().filter(r=>r.y===found.y&&r.theta===found.theta).map(r=>'#'+r.order).join(', ')}`:''}));
$('first').onclick=()=>switchData('first');$('second').onclick=()=>switchData('second');$('prev').onclick=()=>{stop();select(index-1)};$('next').onclick=()=>{stop();select(index+1)};$('slider').oninput=()=>{stop();select(Number($('slider').value)-1)};$('all').onclick=()=>{stop();overview=true;update()};$('play').onclick=()=>{if(timer){stop();return}if(overview||index===rows().length-1)index=0;overview=false;update();$('play').textContent='❚❚ 일시정지';timer=setInterval(()=>{if(index>=rows().length-1){stop();return}select(index+1)},350)};window.addEventListener('resize',update);switchData('first');
</script>
</html>
