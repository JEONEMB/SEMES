  <g id="text_9">
   <text style="font-weight: 700; font-size: 20px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #263444" x="432" y="24.90375" transform="rotate(-0 432 24.90375)">추정 구간을 붙인 다음, 같은 QR의 촬영 결과끼리 비교</text>
  </g>
  <g id="text_10">
   <text style="font-size: 14px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #a34025" x="432" y="57.96" transform="rotate(-0 432 57.96)">원리 설명용 가상 예시 — 실제 데이터·실제 추정 구간이 아닙니다</text>
  </g>
  <g id="text_11">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #263444" transform="translate(177.0825 413.6925)">겹침은 일치 여부를 살펴볼 단서</text>
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #263444" transform="translate(156.973125 433.44)">그 자체가 정답 위치를 보장하지는 않음</text>
  </g>
  <g id="text_12">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #263444" transform="translate(566.413125 413.61375)">촬영별 기준 차이를 남겨 두고 확인</text>
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; fill: #263444" transform="translate(542.413125 433.44)">평균이나 넓힌 구간으로 강제로 합치지 않음</text>
  </g>
  <g id="text_13">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #263444" x="432" y="486.36" transform="rotate(-0 432 486.36)">실제 r은 회귀의 불확실성으로 계산해야 합니다. 여기의 막대 길이에는 통계적 의미가 없습니다.</text>
  </g>
