   <g id="text_8">
    <text style="font-size: 15px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #263444" x="671.779115" y="138.2" transform="rotate(-0 671.779115 138.2)">B. 일부 촬영의 구간이 떨어져 있음</text>
