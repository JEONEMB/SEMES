%YAML:1.0
---
# alignment() 설정 (A507 장비) — 값은 모두 여기서 바꾼다 (코드 수정 불필요)
# 폴더 구성 : Code/config/alignment.yml (이 파일), Code/config/model_s1d1.yml (보정식). 사진 파일은 쓰지 않음
# 상대 경로는 실행 폴더 → 이 설정 파일 폴더(config/) 순으로 찾음
#
# 교보재(SEMES) 방식과 다른 점
#  - 기준(center) 사진·ROI 템플릿 없이 사진 한 장 안의 절대 위치로 잰다 (relocation 불필요)
#  - ① Coarse(위상 상관) → ① QR 띠·사각형 찾기, ② Fine(IC-GN) → ② 나사 ROI 위치 추정 + 머리 원 맞춤
#  - s = QR 3개 중심 가로 위치, d = s − 나사 가로 위치 평균 (교보재 : 기준 사진 대비 이동)
#  - 부호 : A507 은 +Y, +Θ 에서 플레이트가 화면 왼쪽으로 감 (교보재와 반대). 출력은 A507 스테이지 명령 방향

image_width_px: 3840
image_height_px: 2160

# ① QR 3개 : 1/4 축소 영상에서 어두운 띠 → 흰 사각형 3개 → 4변 서브픽셀 직선 → 중심
qr:
   search_roi: { x_px: 600, y_px: 500, width_px: 2640, height_px: 1200 }   # 띠를 찾는 영역
   strip_dark_thr: 90           # 1/4 축소 영상에서 이보다 어두우면 띠 후보
   strip_min_width_px: 600
   strip_aspect_min: 2.5
   strip_aspect_max: 8
   square_thr_frac: 0.25        # 사각형 투영 문턱 = 어두움 + 0.25 × (밝음 − 어두움)
   projection_smooth_px: 4
   gap_merge_px: 20
   square_size_min_px: 150
   square_size_max_px: 260
   edge_margin: 0.15            # 변 양 끝 15 % 는 안 씀 (둥근 모서리)
   edge_search_px: 8
   edge_plateau_px: 4
   edge_segments: 6

# ② 나사 ROI (뒤판 위, 플레이트와 같이 움직임 : Y −11.1 px/mm, Θ −85 px/°)
#   ROI 위치 추정 : x = cx + follow_x × (qx − qr_ref_x),  y = cy + follow_y × (qy − qr_ref_y)  — QR 을 먼저 찾고 그 이동량으로 옮김
#   ROI 안 : 크게 흐린 영상의 최소점 → 머리 바깥 테두리 120방향 → 원 맞춤 → 중심
#   (교보재 background_rois W2·W3 와 같은 자리 : 왼쪽 아래 + 오른쪽 위. 나사를 바꾸면 보정식을 다시 학습해야 함)
screws:
   rois:
      - { name: S_LB, cx_px: 1004, cy_px: 1710 }   # 왼쪽 아래 나사 (센터 사진 기준)
      - { name: S_RT, cx_px: 2789, cy_px: 1422 }   # 오른쪽 위 나사
   qr_ref_x_px: 1906.3          # 센터 사진의 QR 중심
   qr_ref_y_px: 1130.8
   follow_x: 0.95               # 나사는 QR 보다 Y 에서 덜 움직임 (−11.1 / −14.6 px/mm)
   follow_y: 1.0
   roi_half_width_px: 110       # ROI 220 × 180 px
   roi_half_height_px: 90
   blur_sigma_px: 2.5           # 머리 안 반사광을 누르는 흐림
   rim_thr_frac: 0.3            # 테두리 문턱 = 배경 − 0.3 × (배경 − 머리 중심)
   radius_max_px: 48            # 머리 반지름 상한 (실측 약 33)
   rays: 120
   min_contrast: 15             # 배경 − 머리 밝기 차 하한 (가림·조명 이상 → 실패)

# ④ 보정식 (s·d ↔ Y·Θ 계수, 이 설정 파일 폴더 기준). align_train 이 만든다
#    model_s1d2.yml : s 는 Θ 1차, d 는 Θ 2차 (계수 7개). Θ 차수 4조합 중 교차검증·검증셋 모두 가장 좋았음
model_file: "model_s1d2.yml"

# 현장 영점 : 모델 결과에서 뺄 값. main --zero <센터 사진> 또는 alignment_set_reference(사진, true) 가 씀
#   센터에 놓을 때는 정렬할 때와 같은 방향(−쪽에서 지나쳐 접근)으로 (반대면 백래시만큼 Θ 가 밀림)
zero:
   y_mm: 0
   t_deg: 0

# 허용 범위 (참고값 — alignment() 는 쓰지 않음. 장비 쪽 멈춤 판정 기준)
tolerance:                 # 권장 멈춤 기준 : 명세의 절반
   y_um: 45.0
   t_deg: 0.045
spec_tolerance:            # 명세
   y_um: 90.0
   t_deg: 0.09

# ---------------------------------------------------------------- align_train (학습·평가 도구)
#   feature_csv 가 있으면 그 파일을 쓰고(사진 불필요), 없거나 지우면 image_dir 의 사진을 다시 잰다
#   image_dir 은 Code 폴더에서 실행할 때 기준 (Virtual_Robot/rig_grid/rig_grid 등)
training:
   train:
      - { name: grid, image_dir: "../../rig_grid/rig_grid", feature_csv: "data/features_grid.csv" }
      - { name: set1, image_dir: "../../rig_1st/rig_1st", feature_csv: "data/features_set1.csv" }
   test: []
   theta_order_s: 1
   theta_order_d: 2
   cv_blocks: 5
   threads: 0
   output: "config/model_s1d2.yml"
   result_dir: "results"

# ---------------------------------------------------------------- main.cpp (예제)
demo:
   image: "img/center_sample.bmp"   # 인자 없이 실행할 때 쓰는 사진 (설치 점검용, 실행 폴더 기준)
   display_width_px: 1600
