%YAML:1.0
---
# 시나리오: 이동하면 나올 사진을 미리 정해 둔 재생 입력. 실제 촬영이 아니다.
# 사진은 data/ 기준 상대 경로. clean 사진을 복사하지 않고 가리키기만 한다.
# next_image: nearest_pose = 이동 후 계산된 자세와 가장 가까운 단계의 사진을 다음 입력으로 쓴다.
#   tolerance 안에 단계가 없으면 "재촬영 불가"로 중단한다.
name: "S01_Y_small"
category: "Y 작게"
description: "Y만 틀어짐 (+0.20). 1차에서 T가 0.09 이내 → 2차 control이 Y 보정"
next_image: nearest_pose
tolerance_y: 0.025
tolerance_t: 0.005
steps:
  - label: "시작 (1차 joint 입력)"
    y: 0.20
    t: 0.00
    image: "clean/clean_20261014/Y/Y+0.20.bmp"
  - label: "보정 후 (도착)"
    y: 0.00
    t: 0.00
    image: "clean/clean_20261014/center.bmp"
