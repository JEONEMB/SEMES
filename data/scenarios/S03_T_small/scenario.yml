%YAML:1.0
---
# 시나리오: 이동하면 나올 사진을 미리 정해 둔 재생 입력. 실제 촬영이 아니다.
# 사진은 data/ 기준 상대 경로. clean 사진을 복사하지 않고 가리키기만 한다.
# 첫 단계 사진만 입력으로 쓰고, 이동 후 사진은 data/clean 전체에서 계산된 자세와 가장 가까운 사진을 고른다
#   (next_image: nearest_clean_photo). 기준 사진 clean_20261014/center.bmp는 모듈 기준과 같은 파일이라 제외한다.
#   tolerance 안에 사진이 없으면 "재촬영 불가"로 중단한다. 아래 2단계 이후는 예상 경로 기록이다.
name: "S03_T_small"
category: "T 작게"
description: "T만 틀어짐 (+0.20). 1차 joint가 T 보정 → 2차에서 확인"
next_image: nearest_clean_photo
tolerance_y: 0.025
tolerance_t: 0.005
steps:
  - label: "시작 (1차 joint 입력)"
    y: 0.00
    t: 0.20
    image: "clean/clean_20261014/Theta/T+0.20.bmp"
  - label: "보정 후 (도착)"
    y: 0.00
    t: 0.00
    image: "clean/clean_20261020/기준 위치/center1.bmp"
