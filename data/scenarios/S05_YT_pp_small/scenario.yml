%YAML:1.0
---
# 시나리오: 이동하면 나올 사진을 미리 정해 둔 재생 입력. 실제 촬영이 아니다.
# 사진은 data/ 기준 상대 경로. clean 사진을 복사하지 않고 가리키기만 한다.
# next_image: nearest_pose = 이동 후 계산된 자세와 가장 가까운 단계의 사진을 다음 입력으로 쓴다.
#   tolerance 안에 단계가 없으면 "재촬영 불가"로 중단한다.
name: "S05_YT_pp_small"
category: "YT ++ 작게"
description: "Y·T 둘 다 + 방향으로 작게 (+0.10, +0.10)"
next_image: nearest_pose
tolerance_y: 0.025
tolerance_t: 0.005
steps:
  - label: "시작 (1차 joint 입력)"
    y: 0.10
    t: 0.10
    image: "clean/clean_20261020/Y+0.10 T+0.10/Y+0.1 T+0.1 (1).bmp"
  - label: "T 정렬 후 (2차 control 입력)"
    y: 0.10
    t: 0.00
    image: "clean/clean_20261014/Y/Y+0.10.bmp"
  - label: "Y 정렬 후 (도착)"
    y: 0.00
    t: 0.00
    image: "clean/clean_20261014/center.bmp"
