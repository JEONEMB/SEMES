<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 680 680" role="img">
<title>Y·T 추정 방법 6가지 개념도</title>
<desc>기하 모델, 평면 시차, 선형 회귀·GLS, 판별·가설 비교, 학습 기반 회귀, 시각 서보를 각각 한 칸에 그린 개념도</desc>
<defs>
<style>
text { font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; }
.th { font-size: 14px; font-weight: 700; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.th-teal { font-size: 14px; font-weight: 700; fill: #085041; }
.th-gray { font-size: 14px; font-weight: 700; fill: #444441; }
</style>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="680" fill="#FFFFFF"/>

<rect x="40" y="20" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="350" y="20" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="40" y="240" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="350" y="240" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="40" y="460" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="350" y="460" width="290" height="200" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>

<text class="th" x="185" y="44" text-anchor="middle">1. 기하 모델 (호모그래피·PnP)</text>
<rect x="66" y="104" width="26" height="22" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<circle cx="98" cy="115" r="3" fill="#5F5E5A"/>
<line x1="140" y1="92" x2="140" y2="140" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="220,72 300,86 300,162 220,152" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="98" y1="115" x2="220" y2="72" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="98" y1="115" x2="300" y2="86" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="98" y1="115" x2="300" y2="162" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="98" y1="115" x2="220" y2="152" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="220" cy="72" r="3" fill="#D85A30"/><circle cx="300" cy="86" r="3" fill="#D85A30"/><circle cx="300" cy="162" r="3" fill="#D85A30"/><circle cx="220" cy="152" r="3" fill="#D85A30"/>
<text class="ts" x="79" y="146" text-anchor="middle">카메라 K</text>
<text class="ts" x="140" y="158" text-anchor="middle">영상면</text>
<text class="ts" x="185" y="204" text-anchor="middle">점 대응 → 회전 R·이동 t 계산</text>

<text class="th" x="495" y="44" text-anchor="middle">2. 평면 시차</text>
<line x1="380" y1="68" x2="610" y2="68" stroke="#5F5E5A" stroke-width="2"/>
<line x1="380" y1="75" x2="610" y2="75" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="380" y="94">먼 가로선 · 작게 이동</text>
<rect x="440" y="104" width="64" height="50" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="440" y="124" width="64" height="50" rx="3" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="520" y1="106" x2="520" y2="124" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow-coral)"/>
<text class="ts" x="532" y="132">QR · 크게 이동</text>
<text class="ts" x="495" y="204" text-anchor="middle">깊이별 이동 차이로 Y와 T 분리</text>

<text class="th" x="185" y="264" text-anchor="middle">3. 선형 회귀 · GLS</text>
<line x1="80" y1="400" x2="305" y2="400" stroke="#5F5E5A" stroke-width="1"/>
<line x1="80" y1="400" x2="80" y2="282" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="88" y="288">보정값</text>
<line x1="92" y1="392" x2="300" y2="300" stroke="#1D9E75" stroke-width="2"/>
<g fill="#444441"><circle cx="100" cy="384" r="3"/><circle cx="122" cy="382" r="3"/><circle cx="140" cy="366" r="3"/><circle cx="162" cy="362" r="3"/><circle cx="185" cy="346" r="3"/><circle cx="205" cy="345" r="3"/><circle cx="228" cy="326" r="3"/><circle cx="250" cy="327" r="3"/><circle cx="272" cy="308" r="3"/><circle cx="292" cy="306" r="3"/></g>
<text class="ts" x="185" y="424" text-anchor="middle">관측 변위 → (Y, T) 선형식, 공분산 가중</text>

<text class="th" x="495" y="264" text-anchor="middle">4. 판별 · 가설 비교</text>
<rect x="370" y="316" width="80" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="410" y="338" text-anchor="middle" dominant-baseline="central">관측</text>
<rect x="490" y="286" width="130" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th-teal" x="555" y="308" text-anchor="middle" dominant-baseline="central">Y 가설 · 잔차 작음</text>
<rect x="490" y="346" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th-gray" x="555" y="368" text-anchor="middle" dominant-baseline="central">T 가설 · 잔차 큼</text>
<line x1="450" y1="332" x2="488" y2="310" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<line x1="450" y1="344" x2="488" y2="366" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<text class="ts" x="495" y="424" text-anchor="middle">더 잘 설명하는 축 하나를 선택</text>

<text class="th" x="185" y="484" text-anchor="middle">5. 학습 기반 회귀</text>
<rect x="60" y="520" width="60" height="60" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<g fill="#444441"><rect x="68" y="528" width="14" height="14"/><rect x="98" y="528" width="14" height="14"/><rect x="68" y="558" width="14" height="14"/></g>
<polygon points="145,512 165,522 165,580 145,590" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<polygon points="180,522 196,530 196,572 180,580" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<polygon points="211,532 223,538 223,564 211,570" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<line x1="122" y1="551" x2="140" y2="551" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<line x1="226" y1="551" x2="244" y2="551" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
<rect x="248" y="531" width="66" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th-teal" x="281" y="551" text-anchor="middle" dominant-baseline="central">(Y, T)</text>
<text class="ts" x="185" y="644" text-anchor="middle">영상 → 신경망 → 보정값 직접 출력</text>

<text class="th" x="495" y="484" text-anchor="middle">6. 시각 서보</text>
<rect x="381" y="598" width="240" height="22" fill="#E1F5EE"/>
<line x1="380" y1="620" x2="622" y2="620" stroke="#5F5E5A" stroke-width="1"/>
<line x1="380" y1="620" x2="380" y2="506" stroke="#5F5E5A" stroke-width="1"/>
<polyline points="395,512 435,512 435,562 475,562 475,590 515,590 515,606 555,606 555,610 600,610" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<g fill="#D85A30"><circle cx="395" cy="512" r="3"/><circle cx="435" cy="562" r="3"/><circle cx="475" cy="590" r="3"/><circle cx="515" cy="606" r="3"/><circle cx="555" cy="610" r="3"/></g>
<text class="ts" x="450" y="530">촬영 → 추정 → 이동</text>
<text class="ts" x="495" y="644" text-anchor="middle">턴마다 오차 감소, 허용대(±0.09) 진입 시 정지</text>
</svg>
